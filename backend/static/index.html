<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Sentinel Nexus — unified CCTV interoperability and intelligence for statewide surveillance networks.">
<title>Sentinel Nexus — Command Centre</title>

<!-- Inter where it reaches, the platform UI face otherwise. This is designed to
     run on an isolated operator network where fonts.googleapis.com may not
     resolve, so the fallback stack in tokens.css has to look deliberate. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%234d9dff'/><path d='M12 5 6 7.4v3.9c0 3.4 2.6 6.4 6 7.2 3.4-.8 6-3.8 6-7.2V7.4L12 5Z' fill='none' stroke='%23041020' stroke-width='1.8'/></svg>">
</head>
<body>

<!-- Sign-in. Rendered by app.js so the token check and the form live together. -->
<div id="gate" hidden></div>

<div id="shell" hidden>
  <header id="topbar"></header>
  <nav id="rail" aria-label="Sections"></nav>

  <main id="stage">
    <!-- The map is the background of the entire application, not a tab.
         Everything below floats over it. -->
    <div id="map" role="application" aria-label="Camera map"></div>

    <aside id="layers" class="float" aria-label="Map layers"></aside>

    <!-- The cameras the map refuses to draw. Permanently on the map surface
         while any remain, because an unplaced camera is otherwise invisible on
         a map-first interface. -->
    <aside id="unplaced" class="float" aria-label="Cameras not on the map" hidden></aside>

    <aside id="panel" aria-label="Detail panel"></aside>
    <section id="dock" aria-label="Video wall"></section>

    <div id="toasts" aria-live="polite" aria-atomic="false"></div>
  </main>
</div>

<div id="tour" hidden></div>

<noscript>
  <div style="padding:40px;font:14px system-ui;color:#e9eff7;background:#06080c;
              height:100vh">
    <h1 style="font-size:20px;margin:0 0 12px">Sentinel Nexus</h1>
    <p style="color:#a3b3c7;max-width:52ch;line-height:1.6">
      This command centre needs JavaScript. The REST API underneath it does not —
      it is documented at <a href="/docs" style="color:#4d9dff">/docs</a> and can
      be driven directly.
    </p>
  </div>
</noscript>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
